[package]
name = "recall"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Personal engineering solution memory — a local-first CLI that remembers how you solved engineering problems."
license = "MIT"

[lib]
name = "recall"
path = "src/lib.rs"

[[bin]]
name = "recall"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
