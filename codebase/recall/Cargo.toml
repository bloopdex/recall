[package]
name = "recall"
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
description = "Personal engineering solution memory — a local-first CLI that remembers how you solved engineering problems."
license = "MIT"

[lib]
name = "recall"
path = "src/lib.rs"

[[bin]]
name = "recall"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
fastembed = "4"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Network crate, gated behind the opt-in `download` feature: only the
# explicit `recall embeddings download` command may fetch model files
# (ADR-0013). Default builds have no network code path.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[features]
default = []
download = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
