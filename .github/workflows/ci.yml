name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The Rust crate lives at codebase/recall/Cargo.toml, two levels under
    # the repository root: every Cargo command in this job runs there.
    # (The `uses:` actions are unaffected by this default and run at the
    # workspace root, which is where checkout places the repository.)
    defaults:
      run:
        working-directory: codebase/recall

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Zero-network guard (opt-in download feature still builds)
        # The full dependency-tree scan runs inside `cargo test` (tests/security.rs);
        # this step additionally proves the gated network build compiles.
        run: cargo build --features download

      - name: Release build
        run: cargo build --release
